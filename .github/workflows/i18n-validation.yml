name: i18n Validation

on:
  push:
    branches:
      - develop
    paths:
      - 'locales/po/*.po'
      - 'locales/po/*.pot'
      - '.github/workflows/i18n-validation.yml'
  pull_request:
    paths:
      - 'locales/po/*.po'
      - 'locales/po/*.pot'
      - '.github/workflows/i18n-validation.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-i18n:
    name: Validate Translations and POT Template
    # The steps and scripts live in Cacti/cacti so every plugin runs the same checks.
    uses: Cacti/cacti/.github/workflows/reusable-i18n-validation.yml@develop
